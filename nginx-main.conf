#!/bin/bash
# 'set -e' - Forces the script to exit immediately if any command fails. This prevents subsequent commands from running on a broken state.
set -e


# Prints a log message to show that PHP-FPM initialization is beginning.
echo "Starting PHP-FPM..."


# Starts PHP-FPM in the background using the '&' operator. The '-F' flag ensures it runs in the foreground, but '&' pushes it back so the script can continue.
php-fpm -F &

# Saves the Process ID (PID) of the newly started PHP-FPM background process into the 'PHP_PID' variable for tracking.
PHP_PID=$!


# Pauses the script execution for 2 seconds, giving PHP-FPM enough time to fully initialize and bind to its port before Nginx starts.
echo "Waiting for PHP-FPM to start..."
sleep 2


# Logs that Nginx is starting, then executes Nginx in the foreground ('daemon off;'). This is critical because a Docker container stops if its primary foreground process finishes.
echo "Starting Nginx..."
nginx -g "daemon off;"


# Instructs the script to wait for the PHP-FPM process ($PHP_PID) to finish. If PHP-FPM crashes or stops, the script—and subsequently the container—will finally exit.
wait $PHP_PID