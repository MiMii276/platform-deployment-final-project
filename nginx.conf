server {
    # Listen on standard web port 80 as the primary server block
    listen 80 default_server;
    
    # Point directly to Symfony's public directory where index.php lives
    root /app/public;
    index index.php;

    # Where Nginx writes web traffic and error logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Security Headers to protect against clickjacking and sniff attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Performance optimization: Serve static assets directly with 1-year cache
    location ~ ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Allow Let's Encrypt SSL validation requests if needed
    location ~ /\.well-known {
        allow all;
    }

    # Block security risks: Deny access to hidden files (like .git or .env)
    location ~ /\. {
        deny all;
    }

    # Deny access to backup/temporary files left by text editors
    location ~ ~$ {
        deny all;
    }

    # Main Router: If a file exists, serve it. Otherwise, send it to index.php
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # PHP-FPM execution block
    location ~ ^/index\.php {
        # Forward the request to PHP-FPM listening on localhost port 9000
        fastcgi_pass localhost:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;

        # Tell PHP exactly where the file script paths are located on disk
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Prevent gateway timeouts by allowing 60 seconds for processing
        fastcgi_read_timeout 60s;
        fastcgi_connect_timeout 60s;
        
        # Ensure this block is internal-only and cannot be triggered outside
        internal;
    }

    # Security: Prevent direct execution of any other custom PHP files
    location ~ \.php$ {
        return 404;
    }
}