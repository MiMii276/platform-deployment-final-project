services:
  platform_docker-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rona-app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: "mysql://app_user:app_pass@platform_docker-db:3306/app_db?serverVersion=8.0.44&charset=utf8mb4"
    ports:
      - "8000:8000"
    depends_on:
      platform_docker-db:
        condition: service_healthy
    networks:
      - platform_network

  platform_docker-db:
    image: mysql:8.0
    container_name: rona-db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_pass
    ports:
      - "3306:3306"
    volumes:
      - platform_db_data:/var/lib/mysql
    networks:
      - platform_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  platform_docker-phpmyadmin:
    image: phpmyadmin/phpmyadmin  
    container_name: rona-phpmyadmin
    environment:
      PMA_HOST: platform_docker-db
      PMA_USER: app_user
      PMA_PASSWORD: app_pass
    ports:
      - "8080:80"
    depends_on:
      platform_docker-db:
        condition: service_healthy
    networks:
      - platform_network

volumes:
  platform_db_data:

networks:
  platform_network:
    driver: bridge
